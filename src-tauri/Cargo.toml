[package]
name = "tenax"
version = "0.1.0"
description = "Windows cybersecurity toolkit"
authors = ["Asorajx"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tenax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The web request for Breached Passwords. native-tls uses Windows' own secure connection (Schannel).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Hashes the password on this PC before anything is sent.
sha1 = "0.11"
url = "2.5.8"
psl = "2.1.255"
idna = "1.1.0"
scraper = "0.29.0"

# Microsoft's Windows API bindings. Tauri already includes this crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SecurityCenter",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
